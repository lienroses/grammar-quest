<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="语法闯关">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#667eea">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>英语语法闯关挑战 · iPad 版</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
    min-height: 100vh;
    padding-bottom: 40px;
}

/* 顶部状态栏 */
.top-bar {
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.status-wrap {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.status-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 70px;
}

.status-label {
    font-size: 13px;
    color: #7f8c8d;
    margin-bottom: 4px;
}

.status-value {
    font-size: 22px;
    font-weight: bold;
    color: #2c3e50;
}

.status-value.score {
    color: #f39c12;
}

.status-value.cover-ok { color: #27ae60; }
.status-value.cover-no { color: #e74c3c; }

/* 组切换栏 */
.group-bar {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.group-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 8px;
    background: #fff;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: all 0.2s;
}

.group-btn:hover:not(:disabled) {
    background: #4a90e2;
    color: white;
}

.group-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.group-info {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
    min-width: 180px;
    text-align: center;
}

.group-info .sub {
    font-size: 13px;
    color: #7f8c8d;
    font-weight: normal;
    margin-top: 2px;
}

.group-info .sub.extra {
    color: #9b59b6;
    font-weight: bold;
}

/* 操作栏 */
.operate-bar {
    max-width: 1000px;
    margin: 10px auto 20px;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.operate-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}

.operate-btn:hover {
    background: #357abd;
    transform: translateY(-1px);
}

.operate-btn.orange { background: #f39c12; }
.operate-btn.orange:hover { background: #e67e22; }
.operate-btn.green { background: #27ae60; }
.operate-btn.green:hover { background: #219a52; }
.operate-btn.purple { background: #9b59b6; }
.operate-btn.purple:hover { background: #8e44ad; }
.operate-btn.gray { background: #95a5a6; }
.operate-btn.gray:hover { background: #7f8c8d; }

/* 解锁提示 */
.unlock-tip {
    max-width: 1000px;
    margin: 0 auto 10px;
    padding: 12px 20px;
    background: #e8f6f3;
    border: 1px solid #27ae60;
    border-radius: 8px;
    color: #1e8449;
    font-size: 14px;
    text-align: center;
    font-weight: bold;
    animation: slideDown 0.3s;
}

.unlock-tip.warn {
    background: #fef6e7;
    border-color: #f39c12;
    color: #b9770e;
}

@keyframes slideDown {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* 题目网格 */
.grid-container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
}

.grid-item {
    aspect-ratio: 1;
    border: none;
    border-radius: 14px;
    background: #fff;
    color: #4a90e2;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    position: relative;
}

.grid-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(74,144,226,0.2);
    color: #357abd;
}

.grid-item.done {
    cursor: default;
    transform: none;
}

.grid-item.correct {
    background: #eafaf1;
    color: #27ae60;
}

.grid-item.wrong {
    background: #fdf0ef;
    color: #e74c3c;
}

.grid-item .star {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 14px;
}

/* 弹窗通用 */
.modal-mask {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 620px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: slideUp 0.3s;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal-title {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
    color: #2c3e50;
}

.section-title {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
    margin: 18px 0 10px;
    padding-left: 8px;
    border-left: 4px solid #4a90e2;
}

/* 答题弹窗 */
.question-text {
    font-size: 20px;
    line-height: 1.6;
    text-align: center;
    margin-bottom: 8px;
    color: #2c3e50;
}

.question-point {
    text-align: center;
    font-size: 13px;
    color: #9b59b6;
    background: #f6f0fa;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    margin: 0 auto 18px;
    display: table;
}

.options-box {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
}

.option-btn {
    padding: 14px 18px;
    border: 2px solid #e8ecef;
    border-radius: 10px;
    background: #fafbfc;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    color: #34495e;
}

.option-btn:hover {
    border-color: #4a90e2;
    background: #f0f7ff;
}

.option-btn.correct {
    border-color: #27ae60;
    background: #eafaf1;
    color: #27ae60;
}

.option-btn.wrong {
    border-color: #e74c3c;
    background: #fdf0ef;
    color: #e74c3c;
}

.feedback-line {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 16px;
    min-height: 24px;
}

.feedback-line.correct { color: #27ae60; }
.feedback-line.wrong { color: #e74c3c; }

.modal-footer {
    display: flex;
    justify-content: flex-end;
}

.close-btn {
    padding: 9px 22px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.close-btn:hover { background: #357abd; }

/* 总结弹窗 */
.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0f2f5;
    font-size: 15px;
}

.summary-row:last-child { border-bottom: none; }
.summary-row .label { color: #7f8c8d; }
.summary-row .value { font-weight: bold; color: #2c3e50; }

/* 知识图谱 折叠层级 */
.tree-level1 { margin-bottom: 12px; }

.tree-btn {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #f8f9fa;
    text-align: left;
    font-size: 15px;
    font-weight: bold;
    color: #2c3e50;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
}

.tree-btn:hover { background: #eef2f7; }

.tree-btn .arrow {
    transition: transform 0.2s;
    font-size: 12px;
    color: #7f8c8d;
}

.tree-btn.open .arrow { transform: rotate(90deg); }

.tree-children {
    display: none;
    padding-left: 16px;
    margin-top: 8px;
    border-left: 2px solid #e8ecef;
}

.tree-children.open { display: block; }
.tree-level2 { margin-bottom: 8px; }
.tree-btn.level2 { padding: 10px 14px; font-size: 14px; background: #fdfdfd; }

.tree-level3 {
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: #34495e;
}

.tree-level3 .name {
    min-width: 120px;
    flex-shrink: 0;
}

.tree-level3 .cover-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #bdc3c7;
    flex-shrink: 0;
}

.tree-level3 .cover-dot.yes { background: #27ae60; }
.tree-level3 .cover-dot.no { background: #e74c3c; }

.tree-badge {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 8px;
    background: #ecf0f1;
    color: #7f8c8d;
    flex-shrink: 0;
}

.tree-badge.lv1 { background: #eafaf1; color: #27ae60; }
.tree-badge.lv2 { background: #fef6e7; color: #d68910; }
.tree-badge.lv3 { background: #fdf0ef; color: #e74c3c; }

/* 进度条 */
.progress-bar {
    flex: 1;
    height: 10px;
    border-radius: 5px;
    background: #ecf0f1;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.3s;
}

.progress-fill.excellent { background: #27ae60; }
.progress-fill.good { background: #f39c12; }
.progress-fill.normal { background: #e67e22; }
.progress-fill.weak { background: #e74c3c; }
.progress-fill.none { background: #bdc3c7; }

.progress-text {
    min-width: 50px;
    text-align: right;
    font-size: 12px;
    color: #7f8c8d;
    font-weight: bold;
}

/* 覆盖率面板 */
.cover-panel {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 8px;
}

.cover-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #2c3e50;
    font-weight: bold;
    margin-bottom: 10px;
}

.cover-bar {
    height: 12px;
    background: #ecf0f1;
    border-radius: 6px;
    overflow: hidden;
}

.cover-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #27ae60, #2ecc71);
    transition: width 0.4s;
}

.chip-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}

.chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 14px;
    background: #fdf0ef;
    color: #e74c3c;
    border: 1px solid #f5c6c2;
}

.chip.ok {
    background: #eafaf1;
    color: #27ae60;
    border-color: #bfe6cf;
}

/* 错题本 */
.wrong-item {
    padding: 12px;
    border-bottom: 1px solid #f0f2f5;
}

.wrong-item:last-child { border-bottom: none; }
.wrong-question { font-size: 15px; color: #2c3e50; margin-bottom: 6px; }
.wrong-info { font-size: 13px; color: #7f8c8d; }
.wrong-info span { color: #e74c3c; }

.empty-tip {
    text-align: center;
    color: #95a5a6;
    padding: 40px 0;
    font-size: 14px;
}

/* 成就面板 */
.achievement-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.achievement-card {
    padding: 12px;
    border-radius: 10px;
    background: #f8f9fa;
    text-align: center;
    opacity: 0.4;
}

.achievement-card.unlocked {
    background: #fff8e1;
    opacity: 1;
}

.achievement-icon { font-size: 24px; margin-bottom: 4px; }
.achievement-name { font-size: 13px; font-weight: bold; color: #2c3e50; }
.achievement-desc { font-size: 11px; color: #95a5a6; margin-top: 2px; }

/* ===================== iPad / 触屏适配 ===================== */
html {
    -webkit-text-size-adjust: 100%;
}

body {
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
}

button {
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
}

.modal-mask {
    overscroll-behavior: contain;
}

.modal-box {
    -webkit-overflow-scrolling: touch;
    max-width: min(620px, 94vw);
}

/* ---------- iPad 横屏（1024 ~ 1180） ---------- */
@media (max-width: 1100px) {
    .status-wrap, .group-bar, .operate-bar, .grid-container, .unlock-tip { max-width: 940px; }
    .grid-container { gap: 12px; }
    .grid-item { font-size: 30px; }
}

/* ---------- iPad 竖屏（768 / 810 / 834） ---------- */
@media (max-width: 860px) {
    .top-bar {
        padding: 12px 14px;
        padding-top: calc(12px + env(safe-area-inset-top));
    }
    .status-wrap { gap: 6px; }
    .status-label { font-size: 12px; }
    .status-value { font-size: 20px; }

    .group-bar { margin: 14px auto; gap: 14px; }
    .group-btn { width: 46px; height: 46px; font-size: 20px; }
    .group-info { font-size: 17px; min-width: 168px; }

    .operate-bar { gap: 8px; margin: 6px auto 14px; }
    .operate-btn { padding: 11px 16px; font-size: 14px; }

    .grid-container { padding: 0 16px; gap: 11px; }
    .grid-item { font-size: 26px; border-radius: 13px; }

    .modal-box { padding: 22px; border-radius: 16px; }
    .question-text { font-size: 19px; margin-bottom: 6px; }
    .option-btn { padding: 13px 16px; font-size: 16px; }
    .close-btn { padding: 10px 24px; font-size: 15px; }
    .section-title { font-size: 15px; }
}

/* ---------- 窄屏：iPad 分屏 / 竖屏三分之一 ---------- */
@media (max-width: 620px) {
    .status-wrap { gap: 4px; }
    .status-item { min-width: 56px; }
    .status-label { font-size: 11px; }
    .status-value { font-size: 17px; }

    .group-bar { gap: 10px; }
    .group-btn { width: 42px; height: 42px; font-size: 18px; }
    .group-info { font-size: 15px; min-width: 128px; }
    .group-info .sub { font-size: 12px; }

    .operate-bar { gap: 6px; }
    .operate-btn { padding: 10px 12px; font-size: 13px; }

    .grid-container { padding: 0 12px; gap: 8px; }
    .grid-item { font-size: 21px; border-radius: 11px; }
    .grid-item .star { font-size: 11px; top: 3px; right: 4px; }

    .modal-box { padding: 18px; max-width: 96vw; }
    .modal-title { font-size: 18px; }
    .question-text { font-size: 17px; }
    .question-point { font-size: 12px; padding: 3px 10px; }
    .option-btn { padding: 12px 14px; font-size: 15px; }
    .feedback-line { font-size: 15px; }

    .tree-level3 { gap: 8px; font-size: 12px; padding: 7px 10px; }
    .tree-level3 .name { min-width: 88px; }
    .progress-text { min-width: 42px; font-size: 11px; }
    .achievement-list { gap: 8px; }
}

/* ---------- 触屏：去掉粘滞的 hover，改为按下反馈 ---------- */
@media (hover: none) {
    .grid-item:hover {
        transform: none;
        box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        color: #4a90e2;
    }
    .grid-item.done:hover { transform: none; }
    .grid-item:active { transform: scale(0.95); }

    .group-btn:hover:not(:disabled) { background: #fff; color: #2c3e50; }
    .group-btn:active:not(:disabled) { background: #4a90e2; color: #fff; }

    .operate-btn:hover { transform: none; }
    .operate-btn.orange:hover { background: #f39c12; }
    .operate-btn.green:hover { background: #27ae60; }
    .operate-btn.purple:hover { background: #9b59b6; }
    .operate-btn.gray:hover { background: #95a5a6; }
    .operate-btn:active { transform: translateY(1px); opacity: 0.9; }

    .option-btn:hover { border-color: #e8ecef; background: #fafbfc; }
    .option-btn:active { border-color: #4a90e2; background: #eaf2ff; }

    .close-btn:hover { background: #4a90e2; }
    .close-btn:active { background: #357abd; }

    .tree-btn:hover { background: #f8f9fa; }
    .tree-btn.level2:hover { background: #fdfdfd; }
    .tree-btn:active { background: #eef2f7; }
}

/* ===== 教师备课 ===== */
.teach-tabs{display:flex;gap:8px;margin-bottom:14px;}
.teach-tab{flex:1;padding:11px 8px;border:2px solid #e1e8ed;background:#fff;border-radius:10px;font-size:15px;font-weight:bold;color:#5a6c7d;cursor:pointer;font-family:inherit;}
.teach-tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:#667eea;}
.teach-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.teach-chip{padding:7px 12px;border:1px solid #d5dde5;background:#f7f9fb;border-radius:16px;font-size:13px;color:#425466;cursor:pointer;white-space:nowrap;font-family:inherit;}
.teach-chip.active{background:#667eea;color:#fff;border-color:#667eea;}
.teach-card{background:#fff;border:1px solid #e4eaf0;border-radius:12px;padding:16px 18px;line-height:1.75;font-size:14.5px;color:#2c3e50;text-align:left;}
.teach-h{font-size:18px;font-weight:bold;color:#2c3e50;margin-bottom:2px;}
.teach-path{font-size:12.5px;color:#8898a8;font-weight:normal;margin-top:2px;}
.teach-sub{font-size:13px;color:#7f8c8d;margin-bottom:12px;}
.teach-sec{font-weight:bold;color:#4a6fa5;margin-top:15px;margin-bottom:5px;font-size:14.5px;}
.teach-body{background:#f6f9ff;border-left:3px solid #667eea;padding:9px 12px;border-radius:6px;}
.teach-formula{background:#2d3e50;color:#7ee2b8;padding:10px 13px;border-radius:6px;font-family:Menlo,Consolas,monospace;font-size:13.5px;overflow-x:auto;white-space:nowrap;}
.teach-ul{margin:0;padding-left:20px;}
.teach-ul li{margin-bottom:5px;}
.teach-q{padding:9px 0;border-bottom:1px dashed #e8edf2;}
.teach-q:last-child{border-bottom:none;}
.teach-qt{font-weight:600;color:#34495e;}
.teach-qa{font-size:13px;color:#27ae60;font-weight:bold;margin-top:3px;}
.teach-opts{font-size:13px;color:#5a6c7d;margin-top:3px;}
.teach-lv{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:9px;font-size:11px;color:#fff;font-weight:normal;vertical-align:middle;}
.teach-lv1{background:#27ae60;}
.teach-lv2{background:#f39c12;}
.teach-lv3{background:#e74c3c;}
.teach-card summary{cursor:pointer;font-weight:bold;color:#4a6fa5;padding:8px 0;outline:none;}
.teach-where{font-size:12.5px;color:#8a6d3b;background:#fff8e6;border:1px solid #f3d78a;border-radius:6px;padding:7px 11px;margin-top:8px;}
.operate-btn.teach-btn{background:linear-gradient(135deg,#4b6cb7,#182848);}
@media(max-width:640px){.teach-card{padding:13px 14px;}.teach-formula{font-size:12.5px;}}
</style>
</head>

const BASE_GROUP_COUNT = 30;
const QUESTIONS_PER_GROUP = 15;
const MAX_GROUP_COUNT = 60;

const GROUP_LEVELS = [
    '基础入门篇','基础巩固篇','基础提升篇',
    '进阶入门篇','进阶巩固篇','进阶提升篇',
    '语法专项篇','从句专项篇','时态专项篇','词法专项篇',
    '综合进阶1','综合进阶2','综合进阶3','综合进阶4','综合进阶5',
    '难点突破1','难点突破2','难点突破3','难点突破4','难点突破5',
    '冲刺提升1','冲刺提升2','冲刺提升3','冲刺提升4','冲刺提升5',
    '全真模拟1','全真模拟2','全真模拟3','全真模拟4','终极挑战'
];

// 固定种子随机数，保证每次打开题目完全一致（存档不会错乱）
function makeRnd(seed){
    let a = seed >>> 0;
    return function(){
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function shuffleArr(arr, rnd){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(rnd() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
}

// 出题状态
const pickState = { used: {} };           // pointId -> 已取用次数
const usedQuestionKeys = new Set();       // 'pointId#index' 已出现过的题目，用于保证不重复出同一道
let extraGroupCount = 0;

// 取一道题：优先取「从未出现过」的题；题库耗尽则取使用次数最少的
function takeQuestion(pid, rnd){
    const list = BANK[pid];
    if(!list || list.length === 0) return null;
    const fresh = [];
    for(let i = 0; i < list.length; i++){
        if(!usedQuestionKeys.has(pid + '#' + i)) fresh.push(i);
    }
    let idx;
    if(fresh.length > 0){
        idx = fresh[Math.floor(rnd() * fresh.length)];
        usedQuestionKeys.add(pid + '#' + idx);
    } else {
        idx = (pickState.used[pid] || 0) % list.length;
    }
    pickState.used[pid] = (pickState.used[pid] || 0) + 1;

    const item = list[idx];
    return {
        q: item[0],
        options: item[1].slice(),
        answer: item[2],
        point: KP_MAP[pid] ? KP_MAP[pid].name : pid,
        pid: pid
    };
}

// 依难度分层取知识点池
function poolForGroup(g){
    const maxLevel = g < 10 ? 1 : (g < 20 ? 2 : 3);
    const pool = KP_LIST.filter(k => (BANK[k.id] && BANK[k.id].length > 0) && k.level <= maxLevel);
    return pool.length > 0 ? pool : KP_LIST.filter(k => BANK[k.id] && BANK[k.id].length > 0);
}

// 生成基础 30 组
function buildBaseGroups(){
    const rnd = makeRnd(20261017);
    KP_LIST.forEach(k => pickState.used[k.id] = 0);
    const result = [];
    for(let g = 0; g < BASE_GROUP_COUNT; g++){
        const pool = poolForGroup(g);
        const picks = [];
        const start = (g * QUESTIONS_PER_GROUP) % pool.length;
        for(let i = 0; i < QUESTIONS_PER_GROUP; i++){
            picks.push(pool[(start + i) % pool.length].id);
        }
        shuffleArr(picks, rnd);
        const questions = [];
        picks.forEach(pid => {
            const q = takeQuestion(pid, rnd);
            if(q) questions.push(q);
        });
        result.push({
            id: g,
            level: GROUP_LEVELS[g] || ('综合练习' + (g + 1)),
            questions: questions
        });
    }
    return result;
}

// 统计已覆盖 / 未覆盖的知识点
function getCoverage(){
    const covered = new Set();
    groups.forEach(g => g.questions.forEach(q => { if(q.pid) covered.add(q.pid); }));
    const missing = KP_LIST.filter(k => !covered.has(k.id));
    return { covered, missing, total: KP_TOTAL, coveredCount: covered.size };
}

// 补一组：先补未覆盖点，再用「从未出现过的新题」补足 15 题（同一道题绝不重复）
function addExtraGroup(missing){
    const rnd = makeRnd(98765 + groups.length * 131);
    const gIndex = groups.length;
    extraGroupCount++;
    const questions = [];
    const inGroup = new Set();

    // 1) 先把没覆盖到的知识点各来一道（严格不超过 15 题，多的留给下一组）
    for(const k of missing){
        if(questions.length >= QUESTIONS_PER_GROUP) break;
        const q = takeQuestion(k.id, rnd);
        if(q && !inGroup.has(q.pid + '|' + q.q)){
            inGroup.add(q.pid + '|' + q.q);
            questions.push(q);
        }
    }

    // 2) 剩余名额：从题库里挑「从未出现过」的题目补足（可重复知识点，但绝不是同一道题）
    if(questions.length < QUESTIONS_PER_GROUP){
        const freshPool = [];
        KP_LIST.forEach(k => {
            const list = BANK[k.id] || [];
            for(let i = 0; i < list.length; i++){
                const key = k.id + '#' + i;
                if(!usedQuestionKeys.has(key)) freshPool.push(k.id + '#' + i);
            }
        });
        shuffleArr(freshPool, rnd);
        for(const key of freshPool){
            if(questions.length >= QUESTIONS_PER_GROUP) break;
            const [pid, i] = key.split('#');
            const item = BANK[pid][Number(i)];
            const sig = pid + '|' + item[0];
            if(inGroup.has(sig)) continue;
            usedQuestionKeys.add(key);
            pickState.used[pid] = (pickState.used[pid] || 0) + 1;
            inGroup.add(sig);
            questions.push({
                q: item[0],
                options: item[1].slice(),
                answer: item[2],
                point: KP_MAP[pid] ? KP_MAP[pid].name : pid,
                pid: pid
            });
        }
    }

    // 3) 题库彻底耗尽时，退化为取练习次数最少的题（保证组内仍不重复）
    let guard = 0;
    while(questions.length < QUESTIONS_PER_GROUP && guard++ < 500){
        const sorted = KP_LIST.slice().sort((a,b) => (pickState.used[a.id]||0) - (pickState.used[b.id]||0));
        const k = sorted[0];
        const q = takeQuestion(k.id, rnd);
        if(!q) break;
        if(inGroup.has(q.pid + '|' + q.q)) continue;
        inGroup.add(q.pid + '|' + q.q);
        questions.push(q);
    }

    shuffleArr(questions, rnd);
    groups.push({
        id: gIndex,
        level: '补充挑战篇 ' + extraGroupCount,
        questions: questions,
        extra: true
    });
}

// 覆盖自检：没覆盖完就一直加组，直到全覆盖或达到上限
function ensureFullCoverage(){
    let guard = 0;
    let added = 0;
    while(guard++ < 40){
        const info = getCoverage();
        if(info.missing.length === 0) break;
        if(groups.length >= MAX_GROUP_COUNT) break;
        addExtraGroup(info.missing);
        added++;
    }
    return added;
}

// iPad / iOS 上 localStorage 可能被禁用（无痕浏览、本地文件打开），做安全降级到内存
const safeStore = {
    mem: {},
    get(k){ try { return localStorage.getItem(k); } catch(e) { return this.mem[k] || null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch(e) { this.mem[k] = v; } }
};

function loadSave(){
    let data = null;
    try {
        const save = safeStore.get(SAVE_KEY);
        if(save) data = JSON.parse(save);
    } catch(e) { data = null; }

    if(data){
        highScore = data.highScore || 0;
        wrongBook = data.wrongBook || [];
        unlockedAchievements = data.unlockedAchievements || [];
        answeredData = data.answeredData || {};
        maxUnlockedGroup = Math.min(data.maxUnlockedGroup || 0, TOTAL_GROUPS - 1);
        maxCombo = data.maxCombo || 0;
        score = data.score || 0;
        const list = Object.values(answeredData);
        totalCorrect = list.filter(i => i.correct).length;
        totalWrong = list.filter(i => !i.correct).length;
    }
}

function saveProgress(){
    try {
        safeStore.set(SAVE_KEY, JSON.stringify({
            highScore, wrongBook, unlockedAchievements, answeredData, maxCombo, score, maxUnlockedGroup
        }));
    } catch(e) { /* 存储不可用时忽略，不影响答题 */ }
}

function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const qs = groups[currentGroup].questions;
    for(let i = 0; i < qs.length; i++){
        const key = `${currentGroup}-${i}`;
        const btn = document.createElement('button');
        btn.className = 'grid-item';
        btn.innerText = i + 1;
        btn.onclick = () => openQuiz(i);
        if(answeredData[key]){
            btn.classList.add('done');
            if(answeredData[key].correct){
                btn.classList.add('correct');
                btn.innerHTML = `${i+1}<span class="star">⭐</span>`;
            } else {
                btn.classList.add('wrong');
            }
        }
        grid.appendChild(btn);
    }
}

function updateGroupBar(){
    document.getElementById('currentGroupText').innerText = currentGroup + 1;
    const info = document.getElementById('groupLevelText');
    info.innerText = groups[currentGroup].level;
    info.className = 'sub' + (groups[currentGroup].extra ? ' extra' : '');
    document.getElementById('prevGroup').disabled = currentGroup <= 0;
    document.getElementById('nextGroup').disabled = currentGroup >= maxUnlockedGroup;
}

function updateStatus(){
    const totalDone = totalCorrect + totalWrong;
    const totalQuestions = TOTAL_GROUPS * QUESTIONS_PER_GROUP;
    const progress = Math.round((totalDone / totalQuestions) * 100);
    const cov = getCoverage();
    const covEl = document.getElementById('coverText');
    covEl.innerText = `${cov.coveredCount}/${cov.total}`;
    covEl.className = 'status-value ' + (cov.missing.length === 0 ? 'cover-ok' : 'cover-no');

    document.getElementById('scoreText').innerText = score;
    document.getElementById('unlockText').innerText = `${maxUnlockedGroup + 1}/${TOTAL_GROUPS}组`;
    document.getElementById('progressText').innerText = `${progress}%`;
    document.getElementById('highScoreText').innerText = highScore;
}

function switchGroup(delta){
    const n = currentGroup + delta;
    if(n < 0 || n > maxUnlockedGroup) return;
    currentGroup = n;
    renderGrid();
    updateGroupBar();
}

function checkGroupUnlock(){
    const qs = groups[currentGroup].questions;
    let allDone = true;
    for(let i = 0; i < qs.length; i++){
        if(!answeredData[`${currentGroup}-${i}`]) { allDone = false; break; }
    }
    if(allDone && currentGroup === maxUnlockedGroup && maxUnlockedGroup < TOTAL_GROUPS - 1){
        maxUnlockedGroup++;
        showUnlockTip(`🎉 第${maxUnlockedGroup + 1}组已解锁！「${groups[maxUnlockedGroup].level}」，继续挑战吧`);
        updateGroupBar(); updateStatus(); saveProgress(); checkAchievements();
        return true;
    }
    return false;
}

function showUnlockTip(text, warn){
    const tip = document.getElementById('unlockTip');
    tip.className = 'unlock-tip' + (warn ? ' warn' : '');
    tip.innerText = text;
    tip.style.display = 'block';
    setTimeout(() => { tip.style.display = 'none'; }, 4000);
}

// ============================================================
// 七、答题逻辑
// ============================================================
function openQuiz(index){
    const key = `${currentGroup}-${index}`;
    if(answeredData[key]) return;
    currentQuestionIndex = index;
    answered = false;
    const q = groups[currentGroup].questions[index];
    document.getElementById('questionText').innerText = q.q;
    document.getElementById('questionPoint').innerText = '📌 ' + q.point;
    const optBox = document.getElementById('optionsBox');
    optBox.innerHTML = '';
    const fb = document.getElementById('feedbackLine');
    fb.innerText = ''; fb.className = 'feedback-line';
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = String.fromCharCode(65 + i) + '. ' + opt;
        btn.onclick = () => checkAnswer(i);
        optBox.appendChild(btn);
    });
    document.getElementById('quizModal').style.display = 'flex';
}

function checkAnswer(optionIndex){
    if(answered) return;
    answered = true;
    const btns = document.querySelectorAll('.option-btn');
    const q = groups[currentGroup].questions[currentQuestionIndex];
    const correct = q.answer;
    const isCorrect = optionIndex === correct;
    const feedback = document.getElementById('feedbackLine');
    const key = `${currentGroup}-${currentQuestionIndex}`;

    if(isCorrect){
        btns[optionIndex].classList.add('correct');
        combo++;
        if(combo > maxCombo) maxCombo = combo;
        const addScore = 10 + (combo - 1) * 2;
        score += addScore;
        totalCorrect++;
        feedback.className = 'feedback-line correct';
        feedback.innerText = combo >= 2 ? `✅ 正确！连击 x${combo} +${addScore}分` : `✅ 回答正确！+${addScore}分`;
        answeredData[key] = { correct:true, point:q.point };
        wrongBook = wrongBook.filter(item => item.key !== key);
    } else {
        btns[optionIndex].classList.add('wrong');
        btns[correct].classList.add('correct');
        combo = 0;
        totalWrong++;
        feedback.className = 'feedback-line wrong';
        feedback.innerText = `❌ 答错啦！正确答案：${String.fromCharCode(65+correct)}  知识点：${q.point}`;
        answeredData[key] = { correct:false, point:q.point };
        if(!wrongBook.find(item => item.key === key)){
            wrongBook.push({ key, q:q.q, point:q.point, yourAnswer:q.options[optionIndex], rightAnswer:q.options[correct] });
        }
    }
    checkAchievements();
    checkGroupUnlock();
    renderGrid();
    updateStatus();
    saveProgress();
}

function closeQuiz(){
    document.getElementById('quizModal').style.display = 'none';
}

// ============================================================
// 八、成就系统
// ============================================================
function checkAchievements(){
    const totalDone = totalCorrect + totalWrong;
    if(totalDone === 1 && !unlockedAchievements.includes('first')) unlockedAchievements.push('first');
    if(isGroupDone(0) && !unlockedAchievements.includes('group1')) unlockedAchievements.push('group1');
    if(maxUnlockedGroup >= 4 && !unlockedAchievements.includes('group5')) unlockedAchievements.push('group5');
    if(maxUnlockedGroup >= 9 && !unlockedAchievements.includes('group10')) unlockedAchievements.push('group10');
    if(maxUnlockedGroup >= 19 && !unlockedAchievements.includes('group20')) unlockedAchievements.push('group20');
    if(maxUnlockedGroup >= TOTAL_GROUPS - 1 && isGroupDone(TOTAL_GROUPS - 1) && !unlockedAchievements.includes('full')) unlockedAchievements.push('full');
    if(combo >= 10 && !unlockedAchievements.includes('combo10')) unlockedAchievements.push('combo10');
    if(score > highScore && score > 0){
        highScore = score;
        if(!unlockedAchievements.includes('highscore')) unlockedAchievements.push('highscore');
    }
}

function isGroupDone(gi){
    const qs = groups[gi] ? groups[gi].questions : [];
    for(let i = 0; i < qs.length; i++){
        if(!answeredData[`${gi}-${i}`]) return false;
    }
    return qs.length > 0;
}

function renderAchievements(){
    const box = document.getElementById('achievementList');
    box.innerHTML = '';
    achievementConfig.forEach(item => {
        const card = document.createElement('div');
        card.className = 'achievement-card' + (unlockedAchievements.includes(item.id) ? ' unlocked' : '');
        card.innerHTML = `<div class="achievement-icon">${item.icon}</div>
            <div class="achievement-name">${item.name}</div>
            <div class="achievement-desc">${item.desc}</div>`;
        box.appendChild(card);
    });
}

// ============================================================
// 九、知识图谱 + 覆盖率
// ============================================================
function calcPointRate(pointName){
    let total = 0, correct = 0;
    for(const key in answeredData){
        const item = answeredData[key];
        if(item.point === pointName){
            total++;
            if(item.correct) correct++;
        }
    }
    if(total === 0) return { rate:0, total:0, status:'none' };
    const rate = Math.round((correct / total) * 100);
    let status = 'weak';
    if(rate === 100) status = 'excellent';
    else if(rate >= 80) status = 'good';
    else if(rate >= 60) status = 'normal';
    return { rate, total, status };
}

// 统计每个知识点在题库中被安排了多少道题
function countPointInGroups(pid){
    let n = 0;
    groups.forEach(g => g.questions.forEach(q => { if(q.pid === pid) n++; }));
    return n;
}

function renderCoverPanel(){
    const cov = getCoverage();
    const panel = document.getElementById('coverPanel');
    const pct = Math.round((cov.coveredCount / cov.total) * 100);
    let html = `
        <div class="cover-head">
            <span>知识点覆盖率</span>
            <span>${cov.coveredCount} / ${cov.total}（${pct}%）</span>
        </div>
        <div class="cover-bar"><div class="cover-bar-fill" style="width:${pct}%"></div></div>
    `;
    if(cov.missing.length === 0){
        html += `<div class="chip-wrap"><span class="chip ok">✅ 全部 ${cov.total} 个知识点已被题库覆盖</span>
                 <span class="chip ok">共 ${TOTAL_GROUPS} 组 / ${TOTAL_GROUPS * QUESTIONS_PER_GROUP} 题</span></div>`;
    } else {
        html += `<div class="chip-wrap">` + cov.missing.map(k => `<span class="chip">未覆盖：${k.name}</span>`).join('') + `</div>`;
    }
    panel.innerHTML = html;
}

function showKnowledgeTree(){
    renderCoverPanel();
    const container = document.getElementById('treeContainer');
    container.innerHTML = '';
    const cov = getCoverage();

    KNOWLEDGE_TREE.forEach(l1 => {
        const d1 = document.createElement('div');
        d1.className = 'tree-level1';
        const b1 = document.createElement('button');
        b1.className = 'tree-btn';
        b1.innerHTML = `${l1.name}<span class="arrow">▶</span>`;
        const c1 = document.createElement('div');
        c1.className = 'tree-children';
        b1.onclick = () => toggleTree(b1, c1);
        d1.appendChild(b1);

        l1.children.forEach(l2 => {
            const d2 = document.createElement('div');
            d2.className = 'tree-level2';
            const b2 = document.createElement('button');
            b2.className = 'tree-btn level2';
            b2.innerHTML = `${l2.name}<span class="arrow">▶</span>`;
            const c2 = document.createElement('div');
            c2.className = 'tree-children';
            b2.onclick = () => toggleTree(b2, c2);
            d2.appendChild(b2);

            l2.children.forEach(l3 => {
                const stat = calcPointRate(l3.name);
                const isCovered = cov.covered.has(l3.id);
                const n = countPointInGroups(l3.id);
                const row = document.createElement('div');
                row.className = 'tree-level3';
                row.innerHTML = `
                    <span class="cover-dot ${isCovered ? 'yes' : 'no'}" title="${isCovered ? '已覆盖' : '未覆盖'}"></span>
                    <span class="name">${l3.name}</span>
                    <span class="tree-badge lv${l3.level}">${l3.level === 1 ? '基础' : (l3.level === 2 ? '进阶' : '提升')}</span>
                    <span class="tree-badge">${n}题</span>
                    <div class="progress-bar">
                        <div class="progress-fill ${stat.status}" style="width:${stat.total === 0 ? 0 : stat.rate}%"></div>
                    </div>
                    <span class="progress-text">${stat.total === 0 ? '未练习' : stat.rate + '%'}</span>
                `;
                c2.appendChild(row);
            });

            d2.appendChild(c2);
            c1.appendChild(d2);
        });

        d1.appendChild(c1);
        container.appendChild(d1);
    });

    document.getElementById('treeModal').style.display = 'flex';
}

function toggleTree(btn, childrenDom){
    btn.classList.toggle('open');
    childrenDom.classList.toggle('open');
}

function closeTree(){
    document.getElementById('treeModal').style.display = 'none';
}

// 手动触发：检查覆盖，未覆盖完就加组
function manualFillGroups(){
    const before = getCoverage();
    if(before.missing.length === 0){
        alert(`✅ 已覆盖全部 ${before.total} 个知识点，无需补组。\n当前共 ${TOTAL_GROUPS} 组 / ${TOTAL_GROUPS * QUESTIONS_PER_GROUP} 道题。`);
        return;
    }
    const added = ensureFullCoverage();
    TOTAL_GROUPS = groups.length;
    updateStatus();
    renderCoverPanel();
    showKnowledgeTree();
    const after = getCoverage();
    showUnlockTip(`➕ 已新增 ${added} 组补充题，当前覆盖 ${after.coveredCount}/${after.total}，共 ${TOTAL_GROUPS} 组`, true);
}

// ============================================================
// 十、总结 / 错题本 / 重置
// ============================================================
function showSummary(){
    const totalDone = totalCorrect + totalWrong;
    const accuracy = totalDone === 0 ? 0 : Math.round((totalCorrect / totalDone) * 100);
    const cov = getCoverage();

    document.getElementById('overviewContent').innerHTML = `
        <div class="summary-row"><span class="label">已完成题目</span><span class="value">${totalDone} / ${TOTAL_GROUPS * QUESTIONS_PER_GROUP}</span></div>
        <div class="summary-row"><span class="label">已解锁组</span><span class="value">${maxUnlockedGroup + 1} / ${TOTAL_GROUPS}</span></div>
        <div class="summary-row"><span class="label">知识点覆盖</span><span class="value">${cov.coveredCount} / ${cov.total}</span></div>
        <div class="summary-row"><span class="label">答对题数</span><span class="value" style="color:#27ae60;">${totalCorrect}</span></div>
        <div class="summary-row"><span class="label">答错题数</span><span class="value" style="color:#e74c3c;">${totalWrong}</span></div>
        <div class="summary-row"><span class="label">总正确率</span><span class="value">${accuracy}%</span></div>
        <div class="summary-row"><span class="label">最高连击</span><span class="value">${maxCombo}</span></div>
        <div class="summary-row"><span class="label">当前积分</span><span class="value" style="color:#f39c12;">${score}</span></div>
    `;

    const pointStats = {};
    for(const key in answeredData){
        const it = answeredData[key];
        if(!pointStats[it.point]) pointStats[it.point] = { total:0, correct:0 };
        pointStats[it.point].total++;
        if(it.correct) pointStats[it.point].correct++;
    }
    let detailHtml = '';
    if(Object.keys(pointStats).length === 0){
        detailHtml = '<div style="text-align:center; color:#95a5a6; padding:20px 0;">暂无答题记录</div>';
    } else {
        detailHtml = '<table style="width:100%;border-collapse:collapse;font-size:14px;">';
        detailHtml += '<tr><th style="background:#f8f9fa;padding:10px;text-align:left;">考察的点</th><th style="background:#f8f9fa;padding:10px;text-align:left;">练习次数</th><th style="background:#f8f9fa;padding:10px;text-align:left;">掌握情况</th></tr>';
        for(const p in pointStats){
            const s = pointStats[p];
            const rate = Math.round((s.correct / s.total) * 100);
            let text = '薄弱', color = '#e74c3c';
            if(rate === 100){ text = '优秀'; color = '#27ae60'; }
            else if(rate >= 80){ text = '良好'; color = '#f39c12'; }
            else if(rate >= 60){ text = '一般'; color = '#e67e22'; }
            detailHtml += `<tr><td style="padding:10px;border-bottom:1px solid #f0f2f5;">${p}</td>
                <td style="padding:10px;border-bottom:1px solid #f0f2f5;">${s.total} 次</td>
                <td style="padding:10px;border-bottom:1px solid #f0f2f5;color:${color};font-weight:bold;">${text} (${rate}%)</td></tr>`;
        }
        detailHtml += '</table>';
    }
    document.getElementById('pointDetail').innerHTML = detailHtml;

    let feedback = '';
    if(totalDone === 0){
        feedback = '还没有开始答题哦，点击数字格子开始挑战吧！';
    } else if(accuracy >= 90){
        feedback = '🌟 正确率非常高！保持这个节奏，把薄弱点再巩固一遍就更稳了。';
    } else if(accuracy >= 75){
        feedback = '👍 掌握得不错！建议把错题本里的题重做一次，重点看错的知识点。';
    } else if(accuracy >= 60){
        feedback = '📘 基础还需加强，建议先回看知识图谱中标红的知识点，再刷一遍对应组。';
    } else {
        feedback = '📕 先别急着推进度，把已做错的题逐题弄懂，效果会比多刷几组更好。';
    }
    if(totalWrong > 0){
        const weak = [...new Set(wrongBook.map(i => i.point))];
        feedback += `<br><br>📝 薄弱知识点：${weak.slice(0,8).join('、')}${weak.length > 8 ? ' 等' : ''}`;
    }
    document.getElementById('feedbackText').innerHTML = feedback;
    document.getElementById('summaryModal').style.display = 'flex';
}

function closeSummary(){ document.getElementById('summaryModal').style.display = 'none'; }

function showWrongBook(){

// ============================================================
// 教师备课模块
// ============================================================
var TEACH_CATS = [];
(function(){
    KNOWLEDGE_TREE.forEach(function(l1){
        l1.children.forEach(function(l2){
            TEACH_CATS.push({ id:l2.id, name:l2.name, l1:l1.name, kps:l2.children });
        });
    });
})();
var teachState = { tab:'group', groupIdx:0, catIdx:0, kpId:'' };

function escT(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function lvName(n){ return n === 1 ? '基础' : (n === 2 ? '进阶' : '提升'); }
// 名称自带“基础 / 进阶 / 提升”的（如 被动语态基础）就不再重复标难度
function kpLabel(k){
    if(!k) return '';
    var tail = k.name.slice(-2);
    if(tail === '基础' || tail === '进阶' || tail === '提升') return escT(k.name);
    return escT(k.name) + '<span class="teach-lv teach-lv' + k.level + '">' + lvName(k.level) + '</span>';
}
// 渲染一道题（label 传前缀，如 “例1. ” 或 “1. ”）
function qBlockTeach(item, label){
    var opts = item[1].map(function(o, i){ return 'ABCD'[i] + '. ' + escT(o); }).join('　');
    return '<div class="teach-q"><div class="teach-qt">' + label + escT(item[0]) + '</div>' +
           '<div class="teach-opts">' + opts + '</div>' +
           '<div class="teach-qa">答案：' + 'ABCD'[item[2]] + '</div></div>';
}

function showTeacher(){
    document.getElementById('teacherModal').style.display = 'flex';
    renderTeachCats();
    renderTeachGroupList();
    switchTeachTab(teachState.tab);
}
function closeTeacher(){
    document.getElementById('teacherModal').style.display = 'none';
}
function switchTeachTab(tab){
    teachState.tab = tab;
    document.getElementById('teachGroupView').style.display = (tab === 'group') ? 'block' : 'none';
    document.getElementById('teachKpView').style.display = (tab === 'kp') ? 'block' : 'none';
    document.getElementById('teachTabGroup').className = 'teach-tab' + (tab === 'group' ? ' active' : '');
    document.getElementById('teachTabKp').className = 'teach-tab' + (tab === 'kp' ? ' active' : '');
    if(tab === 'group') selectTeachGroup(teachState.groupIdx);
    else {
        if(!teachState.kpId){
            var c0 = TEACH_CATS[teachState.catIdx];
            if(c0 && c0.kps[0]) teachState.kpId = c0.kps[0].id;
        }
        renderTeachKps();
        selectTeachKp(teachState.kpId);
    }
}

/* ---------- 按组备课 ---------- */
function renderTeachGroupList(){
    var el = document.getElementById('teachGroupList');
    if(!el) return;
    var h = '';
    for(var i = 0; i < groups.length; i++){
        h += '<button class="teach-chip' + (i === teachState.groupIdx ? ' active' : '') +
             '" onclick="selectTeachGroup(' + i + ')">第' + (i + 1) + '组</button>';
    }
    el.innerHTML = h;
}
function selectTeachGroup(i){
    teachState.groupIdx = i;
    renderTeachGroupList();
    var g = groups[i];
    var cnt = {}, order = [];
    g.questions.forEach(function(q){
        if(!q.pid) return;
        if(!cnt[q.pid]){ cnt[q.pid] = 0; order.push(q.pid); }
        cnt[q.pid]++;
    });
    var kpH = '';
    order.forEach(function(pid){
        var k = KP_MAP[pid];
        if(!k) return;
        kpH += '<button class="teach-chip" onclick="jumpTeachKp(\'' + pid + '\')">' + kpLabel(k) + '</button>';
    });
    var qH = '';
    g.questions.forEach(function(q, idx){
        var opts = q.options.map(function(o, k){ return 'ABCD'[k] + '. ' + escT(o); }).join('　');
        qH += '<div class="teach-q"><div class="teach-qt">' + (idx + 1) + '. ' + escT(q.q) + '</div>' +
              '<div class="teach-opts">' + opts + '</div>' +
              '<div class="teach-qa">答案：' + 'ABCD'[q.answer] + '　【' + escT(q.point) + '】</div></div>';
    });
    document.getElementById('teachGroupCard').innerHTML =
        '<div class="teach-h">第' + (i + 1) + '组 · ' + escT(g.level) + '</div>' +
        '<div class="teach-sub">本组 ' + g.questions.length + ' 题，共涉及 ' + order.length +
        ' 个知识点。点任一知识点可查看讲义（含规则、结构、考点、例题）。</div>' +
        '<div class="teach-row">' + kpH + '</div>' +
        '<details><summary>📝 展开本组全部题目与答案</summary>' + qH + '</details>';
}
function jumpTeachKp(pid){
    var found = -1;
    for(var c = 0; c < TEACH_CATS.length; c++){
        for(var k = 0; k < TEACH_CATS[c].kps.length; k++){
            if(TEACH_CATS[c].kps[k].id === pid){ found = c; break; }
        }
        if(found >= 0) break;
    }
    if(found >= 0) teachState.catIdx = found;
    teachState.kpId = pid;
    teachState.tab = 'kp';
    switchTeachTab('kp');
}

/* ---------- 按知识点 ---------- */
function renderTeachCats(){
    var el = document.getElementById('teachCatList');
    if(!el) return;
    var h = '';
    TEACH_CATS.forEach(function(cat, idx){
        h += '<button class="teach-chip' + (idx === teachState.catIdx ? ' active' : '') +
             '" onclick="selectTeachCat(' + idx + ')">' + cat.name + '</button>';
    });
    el.innerHTML = h;
}
function selectTeachCat(idx){
    teachState.catIdx = idx;
    renderTeachCats();
    renderTeachKps();
    var first = TEACH_CATS[idx].kps[0];
    if(first) selectTeachKp(first.id);
}
function renderTeachKps(){
    var el = document.getElementById('teachKpList');
    if(!el) return;
    var cat = TEACH_CATS[teachState.catIdx];
    if(!cat) return;
    var h = '';
    cat.kps.forEach(function(k){
        h += '<button class="teach-chip' + (k.id === teachState.kpId ? ' active' : '') +
             '" onclick="selectTeachKp(\'' + k.id + '\')">' + kpLabel(k) + '</button>';
    });
    el.innerHTML = h;
}
function selectTeachKp(pid){
    if(!pid) return;
    teachState.kpId = pid;
    renderTeachKps();
    var k = KP_MAP[pid];
    var t = TEACH[pid];
    var el = document.getElementById('teachKpCard');
    if(!el) return;
    if(!t){
        el.innerHTML = '<div class="teach-h">' + (k ? k.name : pid) + '</div>' +
                       '<div class="teach-sub">这个知识点的讲义还没准备，可以先看本组题目讲。</div>';
        return;
    }
    var pH = '';
    t.p.forEach(function(x){ pH += '<li>' + escT(x) + '</li>'; });
    // 这个知识点出现在哪几组（方便讲完直接安排练习）
    var inG = [];
    groups.forEach(function(g, gi){
        for(var qi = 0; qi < g.questions.length; qi++){
            if(g.questions[qi].pid === pid){ inG.push(gi + 1); break; }
        }
    });
    var gTxt = '';
    if(inG.length){
        var show = inG.slice(0, 8).map(function(n){ return '第' + n + '组'; }).join('、');
        gTxt = '<div class="teach-where">📍 出现在：' + show +
               (inG.length > 8 ? ' 等 ' + inG.length + ' 组' : '') + '</div>';
    } else {
        gTxt = '<div class="teach-where">📍 这个知识点暂未出现在任何闯关组里，可讲完让学生做专项练习。</div>';
    }
    var qH = '';
    var allH = '';
    var bank = BANK[pid] || [];
    bank.forEach(function(item, idx){
        if(idx < 2) qH += qBlockTeach(item, '例' + (idx + 1) + '. ');
        else allH += qBlockTeach(item, (idx + 1) + '. ');
    });
    el.innerHTML =
        '<div class="teach-h">' + kpLabel(k) + '</div>' +
        '<div class="teach-path">' + escT(k.path) + '</div>' + gTxt +
        '<div class="teach-sec">📌 核心规则</div><div class="teach-body">' + escT(t.r) + '</div>' +
        '<div class="teach-sec">🔧 结构公式</div><div class="teach-formula">' + escT(t.f) + '</div>' +
        '<div class="teach-sec">⚠️ 考点与易错</div><ul class="teach-ul">' + pH + '</ul>' +
        '<div class="teach-sec">📝 代表例题</div>' + qH +
        (allH ? '<details><summary>📚 展开本知识点其余 ' + Math.max(0, bank.length - 2) + ' 道题（含答案）</summary>' + allH + '</details>' : '');
}

// ============================================================

function closeAchievements(){ document.getElementById('achievementModal').style.display = 'none'; }

function resetGame(){
    if(!confirm('确定要重新开始吗？所有答题进度清空，错题本和成就保留。')) return;
    score = 0; combo = 0; maxCombo = 0; totalCorrect = 0; totalWrong = 0;
    currentGroup = 0; answeredData = {}; maxUnlockedGroup = 0;
    renderGrid(); updateGroupBar(); updateStatus(); saveProgress();
}

// 启动
try {
    init();
} catch(err) {
    if(window.__setBoot){
        window.__setBoot('<div style="font-size:20px;font-weight:bold;color:#e74c3c;margin-bottom:10px;">❌ 初始化失败</div>'
            + '<div style="font-size:14px;color:#7f8c8d;line-height:1.9;">' + String(err && err.message ? err.message : err) + '</div>');
    }
}
</script>
